.hero>*{position:relative}
.logo{display:block;height:62px;width:auto;margin:0 auto 20px}
.quote{font-family:Caveat,cursive;font-size:20px;opacity:.8;margin:0 0 6px}
h1{margin:0;font-size:28px;line-height:1.15}
.sub{opacity:.85;margin-top:6px;font-size:14px}
.pull{margin-top:-64px;padding:0 16px;position:relative}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.10);margin-bottom:14px}
.big{font-size:34px;font-weight:800;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.row.c>div{flex:1;text-align:center}
.muted{color:var(--mut);font-size:13px}
.seg{display:flex;background:#dcd7ca;border-radius:999px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:10px;font:inherit;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--ink);color:#f2efe6}
input,select{width:100%;font:inherit;color:var(--ink);background:#f4f1e9;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;min-width:0}
.two{display:flex;gap:8px}
.btn{width:100%;border:0;background:var(--ink);color:#f2efe6;font:inherit;font-weight:700;border-radius:12px;padding:14px}
.btn.sm{width:auto;padding:10px 14px;font-size:14px}
h3{margin:18px 4px 10px;font-size:17px}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item .t{flex:1;min-width:0}.item .t b{display:block}
.amt.in{color:var(--ok);font-weight:700}.amt.out{color:var(--bad);font-weight:700}
.x{border:0;background:none;color:var(--mut);font-size:18px;padding:4px 8px}
.empty{text-align:center;color:var(--mut);padding:14px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;background:var(--card);border-radius:24px 24px 0 0;display:flex;justify-content:space-around;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.nav button{border:0;background:none;font:inherit;font-size:12px;color:var(--mut);padding:8px 22px;border-radius:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:20px}
.nav button.on{background:var(--ink);color:#f2efe6}
.wk{display:flex;gap:10px;margin-bottom:14px}
.wk button{flex:1;border:0;background:var(--card);border-radius:16px;padding:12px;font:inherit;font-weight:600;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.08)}
pre{white-space:pre-wrap;font:14px/1.6 inherit;font-family:inherit;margin:0}
.bar{height:8px;background:#d6d1c4;border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}

.cols>div{min-width:0}
.dh{display:none}
@media (min-width:900px){
  .app{max-width:none;margin:0;padding:0 0 48px 240px}
  .hero{min-height:220px;padding:36px 56px 110px}
  .logo{margin:0 0 18px}
  .pull{max-width:1180px;margin:-72px 0 0;padding:0 56px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
  .dh{display:block}
  h1{font-size:34px}
  .big{font-size:40px}
  .wk{max-width:520px}
  .nav{left:0;top:0;bottom:0;transform:none;width:240px;max-width:none;border-radius:0;flex-direction:column;justify-content:flex-start;gap:8px;padding:36px 16px;box-shadow:6px 0 18px rgba(0,0,0,.08)}
  .nav button{flex-direction:row;gap:12px;font-size:15px;padding:14px 18px;width:100%;justify-content:flex-start;cursor:pointer}
  .nav button:not(.on):hover{background:#dcd7ca}
  .btn,.seg button,.wk button,.x{cursor:pointer}
}

<script>
const MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAY=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const CAT={in:['Order Grab','Order Gojek','Order Maxim','Order inDrive','Tip','Lainnya'],out:['Bensin','Makan','Servis','Parkir','Pulsa/Kuota','Lainnya']};
let S={tx:[],debts:[]},tab='catat',wk=0,type='in',msg='';

const $=id=>document.getElementById(id);
const fmt=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const P=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const sd=s=>{const d=P(s);return DAY[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

function weekRange(){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+wk*7);const s=new Date(d);d.setDate(d.getDate()+6);return[ymd(s),ymd(d)]}
function stats(a,b){
  const tx=S.tx.filter(t=>t.date>=a&&t.date<=b);
  const masuk=sum(tx.filter(t=>t.type==='in').map(t=>t.amt));
  const keluar=sum(tx.filter(t=>t.type==='out').map(t=>t.amt));
  let hutang=0;S.debts.forEach(d=>d.paid.forEach(p=>{if(p.date>=a&&p.date<=b)hutang+=p.amt}));
  const days={};tx.filter(t=>t.type==='in').forEach(t=>days[t.date]=(days[t.date]||0)+t.amt);
  const dk=Object.keys(days);let best=null;dk.forEach(k=>{if(!best||days[k]>days[best])best=k});
  const cats={};tx.filter(t=>t.type==='out').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amt);
  let big=null;Object.keys(cats).forEach(k=>{if(!big||cats[k]>cats[big])big=k});
  return{tx,masuk,keluar,hutang,bersih:masuk-keluar-hutang,narik:dk.length,best:best?sd(best)+' ('+fmt(days[best])+')':'-',big:big?big+' ('+fmt(cats[big])+')':'-'};
}

function viewCatat(){
  const t=today(),s=stats(t,t),d=new Date();
  const last=[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).slice(0,15);
  return hero('Rapor Narik','Hari ini, '+DAY[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()])+`<div class="pull">
  <div class="card"><div class="muted">Bersih hari ini</div><div class="big">${fmt(s.masuk-s.keluar)}</div><div class="row"><span>Masuk ${fmt(s.masuk)}</span><span>Keluar ${fmt(s.keluar)}</span></div></div>
  <div class="cols"><div><div class="card"><div class="seg"><button id="bin" class="${type==='in'?'on':''}" onclick="setType('in')">Pemasukan</button><button id="bout" class="${type==='out'?'on':''}" onclick="setType('out')">Pengeluaran</button></div>
  <input id="jml" type="number" inputmode="numeric" placeholder="Jumlah (Rp)">
  <div class="two"><select id="cat">${CAT[type].map(c=>`<option>${c}</option>`).join('')}</select><input id="tgl" type="date" value="${t}"></div>
  <input id="note" placeholder="Catatan (opsional)">
  <button class="btn" onclick="addTx()">Simpan</button><div class="muted" style="margin-top:8px">${msg}</div></div></div>
  <div><h3>Catatan terakhir</h3><div class="card">${last.length?last.map(x=>`<div class="item"><div class="t"><b>${esc(x.cat)}</b><span class="muted">${sd(x.date)}${x.note?' · '+esc(x.note):''}</span></div><span class="amt ${x.type}">${x.type==='in'?'+':'−'}${fmt(x.amt)}</span><button class="x" onclick="delTx('${x.id}')">×</button></div>`).join(''):'<div class="empty">Belum ada catatan.<br>Masukkan orderan pertama kamu hari ini.</div>'}</div></div></div></div>`;
}
function viewHutang(){
  const left=sum(S.debts.map(d=>Math.max(0,d.total-sum(d.paid.map(p=>p.amt)))));
  return hero('Hutang','Sisa total: '+fmt(left))+`<div class="pull"><div class="cols"><div><h3 class="dh">Daftar hutang</h3>
  <div class="card">${S.debts.length?S.debts.map(d=>{const pd=sum(d.paid.map(p=>p.amt)),r=Math.max(0,d.total-pd),pc=Math.min(100,d.total?pd/d.total*100:0);
   return `<div class="item" style="display:block"><div class="row"><b>${esc(d.name)}</b><button class="x" onclick="delDebt('${d.id}')">×</button></div>
   <div class="bar"><i style="width:${pc}%"></i></div><div class="row muted"><span>Sisa ${fmt(r)}</span><span>dari ${fmt(d.total)}</span></div>
   <div class="muted">${d.cicilan?'Cicilan '+fmt(d.cicilan)+'/bln':''}${d.due?' · Jatuh tempo '+sd(d.due):''}</div>
   ${r>0?`<div class="two" style="margin-top:8px"><input id="pay${d.id}" type="number" inputmode="numeric" placeholder="Bayar (Rp)" value="${d.cicilan||''}" style="margin:0"><button class="btn sm" onclick="payDebt('${d.id}')">Bayar</button></div>`:'<div class="amt in" style="margin-top:6px">Lunas ✓</div>'}</div>`}).join(''):'<div class="empty">Belum ada hutang tercatat.<br>Tambah di bawah.</div>'}</div></div>
  <div><h3>Tambah hutang</h3><div class="card"><input id="hn" placeholder="Nama (mis. Pinjol A)"><input id="ht" type="number" inputmode="numeric" placeholder="Total yang harus dibayar (Rp)">
  <div class="two"><input id="hc" type="number" inputmode="numeric" placeholder="Cicilan/bulan"><input id="hd" type="date" title="Tgl jatuh tempo"></div>
  <button class="btn" onclick="addDebt()">Simpan hutang</button></div></div></div></div>`;
}
function viewRekap(){
  const[a,b]=weekRange(),s=stats(a,b),A=P(a),B=P(b);
  const per=`${sd(a)} - ${sd(b)}`;
  const txt=`REKAP MINGGUAN OJOL\nPeriode: ${per}\n\nPemasukan: ${fmt(s.masuk)}\nPengeluaran: ${fmt(s.keluar)}\nBayar hutang: ${fmt(s.hutang)}\nBersih: ${fmt(s.bersih)}\nHari narik: ${s.narik}\nHari terbaik: ${s.best}\nPengeluaran terbesar: ${s.big}`;
  window._txt=txt;
  return hero('Rekap Mingguan',per+(wk===0?' (minggu ini)':''),'Langkah kecil untuk cerita besar')+`<div class="pull">
  <div class="wk"><button onclick="wk--;render()">‹ Minggu sebelumnya</button><button onclick="wk++;render()">Minggu berikutnya ›</button></div>
  <div class="cols"><div><div class="card"><div class="muted">Bersih minggu ini</div><div class="big">${fmt(s.bersih)}</div><div class="row c"><div>Masuk<br><b>${fmt(s.masuk)}</b></div><div>Keluar<br><b>${fmt(s.keluar)}</b></div><div>Bayar hutang<br><b>${fmt(s.hutang)}</b></div></div>
  ${s.tx.length?'':'<div class="empty">Belum ada catatan di minggu ini.</div>'}</div></div>
  <div><h3>Teks untuk penasihat keuangan</h3><div class="card"><pre>${esc(txt)}</pre><button class="btn" style="margin-top:12px" onclick="copyTxt(this)">Salin teks</button></div></div></div>
  <button class="btn" style="background:transparent;color:var(--bad);border:1.5px solid var(--bad);margin-top:6px" onclick="resetAll(this)">Reset semua data</button></div>`;
}
function render(){
  const y=window.scrollY;
  $('app').innerHTML=tab==='catat'?viewCatat():tab==='hutang'?viewHutang():viewRekap();
  $('nav').innerHTML=[['catat','🧾','Catat'],['hutang','🍃','Hutang'],['rekap','📄','Rekap']].map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');
  window.scrollTo(0,y);
}
function go(t){tab=t;msg='';window.scrollTo(0,0);render()}
function setType(t){type=t;$('bin').className=t==='in'?'on':'';$('bout').className=t==='out'?'on':'';$('cat').innerHTML=CAT[t].map(c=>`<option>${c}</option>`).join('')}
function addTx(){
  const amt=+$('jml').value;if(!(amt>0)){msg='Isi jumlahnya dulu ya.';render();return}
  S.tx.push({id:uid(),type,amt,cat:$('cat').value,date:$('tgl').value||today(),note:$('note').value.trim()});
  save();msg='Tersimpan ✓';render();
}
function delTx(id){S.tx=S.tx.filter(t=>t.id!==id);save();render()}
function addDebt(){
  const n=$('hn').value.trim(),t=+$('ht').value;if(!n||!(t>0))return;
  S.debts.push({id:uid(),name:n,total:t,cicilan:+$('hc').value||0,due:$('hd').value,paid:[]});save();render();
}
function payDebt(id){
  const v=+$('pay'+id).value;if(!(v>0))return;
  const d=S.debts.find(d=>d.id===id);d.paid.push({date:today(),amt:v});
  if(d.due){const x=P(d.due),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));d.due=ymd(x)}
  save();render();
}
function delDebt(id){S.debts=S.debts.filter(d=>d.id!==id);save();render()}
function copyTxt(btn){
  const done=()=>{btn.textContent='Tersalin ✓'};
  try{navigator.clipboard.writeText(window._txt).then(done,fb)}catch(e){fb()}
  function fb(){const t=document.createElement('textarea');t.value=window._txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');done()}catch(e){}t.remove()}
}
function resetAll(btn){
  if(!btn.dataset.s){btn.dataset.s=1;btn.textContent='Yakin? Ketuk lagi untuk hapus semua';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.s;btn.textContent='Reset semua data'}},4000);return}
  S={tx:[],debts:[]};save();wk=0;render();
}
render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
